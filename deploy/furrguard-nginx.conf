# furrguard.srteb.eu — FurrGuard 2.0 en el nginx de Ubuntu 24.04 / Debian 12, sin panel.
#
# Se instala en /etc/nginx/sites-available/furrguard y se enlaza en sites-enabled/
# (docs/INSTALACION.md, paso 9). La guía cambia furrguard.srteb.eu por tu dominio con sed.
# Debian y Ubuntu incluyen sites-enabled/* dentro del bloque http {} de nginx.conf.
#
# El certificado tiene que existir ANTES de activar este sitio: sin él, nginx -t falla con
# «cannot load certificate». La guía lo emite con certbot --webroot sobre el sitio por defecto
# (/var/www/html) y este archivo sigue sirviendo ese webroot para las renovaciones.
#
# HTTP/2 va en «listen … http2», la sintaxis de nginx 1.22 (Debian 12) y 1.24 (Ubuntu 24.04).
# Desde nginx 1.25.1 se escribe «http2 on;» y la forma de listen solo da un aviso.
#
# Solo se ejecutan los 7 puntos de entrada PHP. Lo demás (código, configuración, datos y estos
# mismos archivos de deploy/) responde 404, y nginx nunca sirve un archivo del código: fuera de
# /admin/assets/ y /public/assets/, todo acaba en index.php o en admin/index.php.

server {
    listen 80;
    listen [::]:80;
    server_name furrguard.srteb.eu;
    server_tokens off;

    # Retos de Let's Encrypt (certbot certonly --webroot -w /var/www/html)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # Nombre fijo y no $host: la cabecera Host la elige el cliente.
    location / {
        return 301 https://furrguard.srteb.eu$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name furrguard.srteb.eu;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/furrguard.srteb.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/furrguard.srteb.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:furrguard_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/furrguard;

    access_log /var/log/nginx/furrguard-access.log;
    # Los errores de PHP también llegan aquí («FastCGI sent in stderr»)
    error_log  /var/log/nginx/furrguard-error.log warn;

    # El JSON del panel admite 1 MB: con 2 MB responde PHP (body_too_large) y no un 413 de nginx.
    client_max_body_size 2m;

    # Cabeceras base. PHP añade en sus respuestas la CSP con nonce, X-Frame-Options y HSTS.
    # No uses add_header dentro de las location de abajo: nginx dejaría de heredar estas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Las renovaciones también pueden llegar por https (Cloudflare con «Always Use HTTPS»).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # ── Bloqueos: código, configuración y datos → 404 ──────────────────────────────────
    # Archivos y carpetas ocultos: .env, .git, .htaccess…
    location ~ /\. {
        return 404;
    }
    location ~ ^/(config|includes|database|bin|storage|vendor|libs|modulos|FurrGuard-plugin|docs|tests|shared|deploy)(/|$) {
        return 404;
    }
    location ~ ^/(admin|public)/(src|node_modules)(/|$) {
        return 404;
    }
    location ~ \.(sql|tsv|md|json|lock|ya?ml|neon|xml|dist|log|env|bak|old|tmp|sh|bat|gradle|properties|java|ts|vue|mmdb|tsbuildinfo)$ {
        return 404;
    }

    # ── Assets compilados por Vite (base /admin/ y /public/) ────────────────────────────
    # ^~ gana a los bloqueos por extensión: los nombres llevan hash y se cachean un año.
    location ^~ /admin/assets/ {
        alias /var/www/furrguard/admin/dist/assets/;
        expires 1y;
        access_log off;
    }
    location ^~ /public/assets/ {
        alias /var/www/furrguard/public/dist/assets/;
        expires 1y;
        access_log off;
    }

    # ── Puntos de entrada PHP (los únicos ejecutables) ──────────────────────────────────
    location ~ ^/(index|verify)\.php$|^/admin/(index|api|callback)\.php$|^/api/(plugin|furrsecurity)\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        # Un poll_changes de un cliente antiguo espera hasta 25 s. Igual que request_terminate_timeout.
        fastcgi_read_timeout 60s;
        fastcgi_pass unix:/run/php/furrguard.sock;
    }
    location ~ \.php$ {
        return 404;
    }

    # ── Rutas de los SPA ────────────────────────────────────────────────────────────────
    location = /admin {
        return 301 https://furrguard.srteb.eu/admin/;
    }
    # Panel: cualquier ruta /admin/… la resuelve admin/index.php (modo historial de Vue)
    location /admin/ {
        rewrite ^ /admin/index.php last;
    }
    # Landing y cualquier otra ruta: index.php
    location / {
        rewrite ^ /index.php last;
    }
}
