; FurrGuard 2.0 — pool de PHP-FPM propio.
;
; Se instala en /etc/php/<versión>/fpm/pool.d/furrguard.conf (docs/INSTALACION.md, paso 2):
; 8.3 en Ubuntu 24.04 y 8.2 en Debian 12. El socket no lleva la versión de PHP, así el sitio de
; nginx no cambia al actualizar PHP.
;
; Los procesos corren como furrguard: leen el código (de root, sin permiso de escritura) y .env
; (grupo furrguard), y solo escriben en storage/. nginx (www-data) solo habla con el socket.
;
; Comprobar:  php-fpm8.3 -t   (php-fpm8.2 en Debian 12)

[furrguard]
user = furrguard
group = furrguard

listen = /run/php/furrguard.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Procesos bajo demanda: el plugin consulta cada pocos segundos y los inicios de sesión llegan a
; ráfagas. Si el log de PHP-FPM dice «server reached pm.max_children», súbelo.
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 60s
pm.max_requests = 1000

; Mismo plazo que fastcgi_read_timeout en nginx.
request_terminate_timeout = 60s

; Solo scripts .php (nginx ya solo pasa los 7 puntos de entrada).
security.limit_extensions = .php

; Entorno limpio: FurrGuard lee su configuración de /var/www/furrguard/.env. Una variable que
; definieras aquí con env[...] tendría prioridad sobre .env.
clear_env = yes

; Errores al log (llegan al error_log del sitio en nginx), nunca a la página.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on

; PHP solo abre archivos dentro de la instalación. Si mueves GEOIP_COUNTRY_DB o GEOIP_ASN_DB
; fuera de /var/www/furrguard, añade aquí su carpeta o el espejo MaxMind saldrá como «missing».
php_admin_value[open_basedir] = /var/www/furrguard/
