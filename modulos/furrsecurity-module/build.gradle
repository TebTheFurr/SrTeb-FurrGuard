plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.0'
}

group = 'org.grinch'
version = '2.0.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

def adventureVersion = '4.20.0' // la de Paper 1.21.4, la plataforma mas antigua soportada
def pluginVersion = version.toString()

dependencies {
    implementation 'org.grinch.furrguard:furrguard-common:2.0.0' // trae Gson y SnakeYAML

    compileOnly 'com.velocitypowered:velocity-api:3.4.0'
    annotationProcessor 'com.velocitypowered:velocity-api:3.4.0'
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'

    testImplementation "net.kyori:adventure-api:$adventureVersion"
    testImplementation "net.kyori:adventure-text-serializer-legacy:$adventureVersion"
    testImplementation "net.kyori:adventure-text-serializer-plain:$adventureVersion"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Paper 1.21.4 exige Java 21. -PtoolchainVersion=26 compila y prueba con otro JDK.
java.toolchain.languageVersion = JavaLanguageVersion.of((findProperty('toolchainVersion') ?: '21') as int)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

def generateBuildConstants = tasks.register('generateBuildConstants', Copy) {
    inputs.property('version', pluginVersion)
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/templates')
    expand version: pluginVersion
}
sourceSets.main.java.srcDir(generateBuildConstants)

tasks.named('processResources') {
    inputs.property('version', pluginVersion)
    filesMatching('plugin.yml') {
        expand version: pluginVersion
    }
}

// Solo se distribuye el jar sombreado (mismo nombre, sin clasificador)
tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    relocate 'org.grinch.furrguard.common', 'org.grinch.furrsecurity.libs.common'
    relocate 'com.google.gson', 'org.grinch.furrsecurity.libs.gson'
    relocate 'org.yaml.snakeyaml', 'org.grinch.furrsecurity.libs.snakeyaml'
    exclude 'META-INF/maven/**', 'META-INF/versions/*/module-info.class', 'module-info.class'
}

tasks.named('assemble') {
    dependsOn 'shadowJar'
}

tasks.named('test') {
    useJUnitPlatform()
}
