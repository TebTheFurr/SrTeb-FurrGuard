plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.0'
}

group = 'org.grinch'
version = '2.0.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

def pluginVersion = version.toString()

dependencies {
    implementation 'org.grinch.furrguard:furrguard-common:2.0.0' // trae Gson y SnakeYAML

    compileOnly 'com.velocitypowered:velocity-api:3.4.0'
    annotationProcessor 'com.velocitypowered:velocity-api:3.4.0'

    testImplementation 'com.velocitypowered:velocity-api:3.4.0' // eventos reales en CommandListenerTest (trae Adventure)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// velocity-api 3.4.0 es Java 17: compila con la JVM de Gradle. -PtoolchainVersion=21|26 fuerza otro JDK.
def toolchainVersion = findProperty('toolchainVersion')
if (toolchainVersion != null) {
    java.toolchain.languageVersion = JavaLanguageVersion.of(toolchainVersion as int)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

def generateBuildConstants = tasks.register('generateBuildConstants', Copy) {
    inputs.property('version', pluginVersion)
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/templates')
    expand version: pluginVersion
}
sourceSets.main.java.srcDir(generateBuildConstants)

// Solo se distribuye el jar sombreado (mismo nombre, sin clasificador)
tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    archiveClassifier.set('')
    relocate 'org.grinch.furrguard.common', 'org.grinch.furrperms.libs.common'
    relocate 'com.google.gson', 'org.grinch.furrperms.libs.gson'
    relocate 'org.yaml.snakeyaml', 'org.grinch.furrperms.libs.snakeyaml'
    exclude 'META-INF/maven/**', 'META-INF/versions/*/module-info.class', 'module-info.class'
}

tasks.named('assemble') {
    dependsOn 'shadowJar'
}

tasks.named('test') {
    useJUnitPlatform()
}
