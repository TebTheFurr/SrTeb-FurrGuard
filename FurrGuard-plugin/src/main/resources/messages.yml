# Mensajes por defecto de FurrGuard. Los que existan en el panel (get_messages) mandan sobre estos.
# Codigos legacy (&c, &l, &x&R&R&G&G&B&B). Los valores de los {placeholders} se insertan como texto plano.
# Globales en todos: {server_name} y {discord} (ajustes server_name y discord_url del panel).

prefix: "&8[&x&0&0&F&F&A&A&lFurrGuard&8] &7"

# ── Kicks al entrar (y al re-verificar a los conectados) ──────────────────────────────
# {id}: ID del baneo o referencia para soporte (tambien sale en la consola)

kick_proxy: |-
  &8╔════════════════════════════════════╗
  &8║  &6&l{server_name}&8                    ║
  &8║                                    ║
  &8║     &c&l✘ CONEXIÓN DENEGADA ✘&8        ║
  &8║                                    ║
  &8║   &7Se ha detectado el uso de       ║
  &8║   &c&lPROXY&7 en tu conexión.         ║
  &8║                                    ║
  &8║   &7Si crees que es un error,       ║
  &8║   &fabre un ticket en nuestro       ║
  &8║   &b&lDiscord&7.                      ║
  &8║                                    ║
  &8║   &8Discord: &b{discord}&8
  &8║   &8ID: &7{id}&8                       ║
  &8╚════════════════════════════════════╝

