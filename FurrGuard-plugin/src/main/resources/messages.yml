# ── Avisos a admins (furrguard.notify / furrguard.admin) ─────────────────────────────
# Acciones del panel: {type} y {value}
whitelist_added: "&x&0&0&F&F&A&A&l+ &7Whitelist añadida: &f{type} &8= &f{value}"
whitelist_removed: "&c&l- &7Whitelist eliminada: &f{type} &8= &f{value}"
blacklist_added: "&c&l+ &7Blacklist añadida: &f{type} &8= &f{value}"
blacklist_removed: "&x&0&0&F&F&A&A&l- &7Blacklist eliminada: &f{type} &8= &f{value}"

# Logins bloqueados: {player} (con el nombre baneado entre parentesis si difiere), {ip}, {isp},
# {country}, {country_code}, {continent}, {ban_id}, {reason} (etiqueta), {block_reason}
notify_proxy_blocked: "&c&l🛡 &c{player} &7bloqueado &8• &f{ip} &8• &cProxy detectado"
notify_vpn_blocked: "&c&l🛡 &c{player} &7bloqueado &8• &f{ip} &8• &cVPN detectada"
notify_hosting_blocked: "&c&l🛡 &c{player} &7bloqueado &8• &f{ip} &8• &cHosting detectado"
notify_mobile_blocked: "&c&l🛡 &c{player} &7bloqueado &8• &f{ip} &8• &cRed móvil detectada"
notify_provider_blocked: "&c&l🛡 &c{player} &7bloqueado &8• &f{ip} &8• &cProveedor: &f{isp}"
notify_country_blocked: "&c&l🛡 &c{player} &7bloqueado &8• &f{ip} &8• &cPaís: &f{country}"
notify_continent_blocked: "&c&l🛡 &c{player} &7bloqueado &8• &f{ip} &8• &cContinente: &f{continent}"
notify_blacklisted: "&c&l🛡 &c{player} &7bloqueado &8• &f{ip} &8• &cBlacklist &8[#{ban_id}]"
notify_compromised_account: "&c&l🛡 &c{player} &7bloqueado &8• &f{ip} &8• &cCuenta comprometida"
player_blocked: "&c&l🛡 &c{player} &7bloqueado &8• &f{ip} &8• &c{reason}"

# Expulsado al re-verificar tras un cambio en el panel
notify_player_kicked: "&c&l⚔ &c{player} &7expulsado &8• &f{ip} &8• &c{reason}"

# Conexiones (ajustes notify_connections / notify_hispanic)
notify_player_join: "&e➜ &e{player} &7conectó desde &f{country} &8({country_code})"
notify_non_hispanic_join: "&6⚠ &f{player} &7conectó desde &f{country} &8({country_code}) &6(No hispanohablante)"
