buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.4.2'
    }
}

import proguard.gradle.ProGuardTask

plugins {
    id 'java'
    id 'eclipse'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.8'
    id 'com.gradleup.shadow' version '8.3.8'
    id 'xyz.jpenilla.run-velocity' version '2.3.1'
}

group = 'org.grinch'
version = '2.0.0'

def velocityApiVersion = '3.4.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly "com.velocitypowered:velocity-api:$velocityApiVersion"
    annotationProcessor "com.velocitypowered:velocity-api:$velocityApiVersion"

    // libs/furrguard-common (includeBuild): trae gson y snakeyaml; todo se sombrea y reubica
    implementation 'org.grinch.furrguard:furrguard-common:2.0.0'

    testImplementation "com.velocitypowered:velocity-api:$velocityApiVersion"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def targetJavaVersion = 17
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

tasks.named('test') {
    useJUnitPlatform()
}

// Un unico artefacto desplegable: build/libs/FurrGuard-<version>.jar (el sombreado)
tasks.named('jar') {
    enabled = false
}
tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

shadowJar {
    archiveClassifier.set('')

    relocate 'org.grinch.furrguard.common', 'org.grinch.furrGuard.libs.common'
    relocate 'com.google.gson', 'org.grinch.furrGuard.libs.gson'
    relocate 'org.yaml.snakeyaml', 'org.grinch.furrGuard.libs.snakeyaml'

    exclude 'module-info.class', 'META-INF/versions/*/module-info.class'
}

tasks {
    runVelocity {
        velocityVersion(velocityApiVersion)
    }
}

// BuildConstants.VERSION (y con ella velocity-plugin.json y la licencia) sale de 'version'
def templateSource = file('src/main/templates')
def templateDest = layout.buildDirectory.dir('generated/sources/templates')
def generateTemplates = tasks.register('generateTemplates', Copy) { task ->
    def props = ['version': project.version]
    task.inputs.properties props

    task.from templateSource
    task.into templateDest
    task.expand props
}

sourceSets.main.java.srcDir(generateTemplates.map { it.outputs })

project.idea.project.settings.taskTriggers.afterSync generateTemplates
project.eclipse.synchronizationTasks(generateTemplates)

// ============================================
// PROGUARD - build/libs/FurrGuard-<version>-obfuscated.jar
// ============================================

def toolchainHome = javaToolchains.launcherFor(java.toolchain).map { it.metadata.installationPath }

def obfuscatePlugin = tasks.register('obfuscatePlugin', ProGuardTask) {
    dependsOn tasks.named('shadowJar')
    injars(tasks.named('shadowJar').flatMap { it.archiveFile })
    outjars(layout.buildDirectory.file("libs/FurrGuard-${project.version}-obfuscated.jar"))
    printmapping(layout.buildDirectory.file('proguard/mapping.txt'))

    // jmods del toolchain 17 y no los de la JVM que ejecuta Gradle: ProGuard 7.4 no lee clases de Java 22+
    def jmods = toolchainHome.get().dir('jmods')
    ['java.base', 'java.net.http', 'java.sql', 'java.logging', 'java.desktop',
     'java.management', 'java.naming', 'java.instrument'].each { module ->
        libraryjars(jmods.file("${module}.jmod"), jarfilter: '!**.jar', filter: '!module-info.class')
    }
    libraryjars(sourceSets.main.compileClasspath)

    dontshrink()
    dontoptimize()
    useuniqueclassmembernames()
    repackageclasses('a')

    dontwarn 'sun.misc.**'

    keepattributes '*Annotation*,Signature,InnerClasses,EnclosingMethod,Record,PermittedSubclasses,NestHost,NestMembers'

    keepclassmembers 'enum * { public static **[] values(); public static ** valueOf(java.lang.String); }'

    // Punto de entrada de velocity-plugin.json (Guice inyecta el constructor)
    keep 'public class org.grinch.furrGuard.FurrGuard { *; }'
    keep '@com.velocitypowered.api.plugin.Plugin class * { *; }'

    // Librerias sombreadas sin ofuscar: reflexion de Gson/SnakeYAML, records e interfaces selladas de la comun
    keep 'class org.grinch.furrGuard.libs.** { *; }'
}

tasks.named('build') {
    dependsOn obfuscatePlugin
}
